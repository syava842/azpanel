{{define "content"}}
<h1>{{.Title}}</h1>
<div class="card">
  <p>{{.Note}}</p>
  <pre>{{range .Items}}{{.}}
{{end}}</pre>
  {{if .Batch}}
  <form method="post" action="{{url "/codes/download"}}">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <input type="hidden" name="batch" value="{{.Batch}}">
    <input type="hidden" name="codes" value="{{.Joined}}">
    <button type="submit">Скачать .txt</button>
  </form>
  {{end}}
  <p><a href="{{url .Back}}">{{.BackText}}</a></p>
</div>
{{end}}
