{{define "content"}}
<h1>Включение двухфакторной проверки</h1>
<div class="card">
  <p>Отсканируйте QR-код приложением-аутентификатором или введите секрет вручную, затем подтвердите кодом из приложения.</p>
  <p><img src="{{.QR}}" alt="QR-код для приложения-аутентификатора" width="256" height="256"></p>
  <p>Секрет: <code>{{.Secret}}</code></p>
  <form method="post" action="{{url "/account/2fa"}}">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <input type="hidden" name="sealed" value="{{.Sealed}}">
    <input type="hidden" name="exp" value="{{.Exp}}">
    <label>Текущий пароль
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <label>Код из приложения
      <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" autofocus required>
    </label>
    <button type="submit">Подтвердить и включить</button>
  </form>
</div>
{{end}}
